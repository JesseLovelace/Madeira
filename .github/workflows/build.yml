name: Build IPA

on:
  push:
  pull_request:
  workflow_dispatch:

# LLVM and FEX are the slow stages (hours on a hosted runner), so they build in
# parallel jobs whose trimmed outputs are cached; the app job restores them and
# runs scripts/build-ipa.sh, which skips any stage whose output already exists.
# xcode-27: the ntdll unix side uses iOS 27 SDK fields (rusage_info_v6.ri_page_wait_time_mach).

jobs:
  llvm:
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          key: llvm-ios-15.0.7-${{ hashFiles('scripts/build/build-llvm-ios.sh') }}
          path: |
            toolchains/llvm-ios-build/lib/*.a
            toolchains/llvm-ios-build/include
            toolchains/llvm-project/llvm/include
      - name: Build LLVM for iOS
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          brew install ninja || true
          scripts/build/build-llvm-ios.sh

  fex:
    runs-on: xcode-27
    timeout-minutes: 360
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - id: key
        run: echo "key=fex-ios-$(git rev-parse HEAD:FEX)-${{ hashFiles('scripts/build/build-fex-ios.sh') }}" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v4
        with:
          key: ${{ steps.key.outputs.key }}
          path: |
            FEX/build-ios
            !FEX/build-ios/**/*.o
      - name: Build FEX for iOS
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          brew install ninja || true
          git submodule update --init --recursive --depth 1 FEX
          scripts/build/build-fex-ios.sh

  app:
    needs: [llvm, fex]
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/cache/restore@v4
        with:
          key: llvm-ios-15.0.7-${{ hashFiles('scripts/build/build-llvm-ios.sh') }}
          fail-on-cache-miss: true
          path: |
            toolchains/llvm-ios-build/lib/*.a
            toolchains/llvm-ios-build/include
            toolchains/llvm-project/llvm/include
      - uses: actions/cache/restore@v4
        with:
          key: ${{ needs.fex.outputs.key }}
          fail-on-cache-miss: true
          path: |
            FEX/build-ios
            !FEX/build-ios/**/*.o
      - name: Build IPA
        run: scripts/build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Madeira-ipa
          path: dist/Madeira.ipa
          if-no-files-found: error
