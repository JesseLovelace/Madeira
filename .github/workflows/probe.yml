name: Probe
on: push
jobs:
  probe:
    if: github.ref == 'refs/heads/ci-probe'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: |
          set -euo pipefail
          export ROOT=$PWD JOBS=$(sysctl -n hw.ncpu)
          sw_vers; xcodebuild -version
          brew install cmake ninja meson pkg-config autoconf automake libtool bison flex sevenzip llvm
          export PATH="$(brew --prefix bison)/bin:$(brew --prefix llvm)/bin:$PATH"
          bash tools/check-prefix-template.sh app/Madeira/prefix-template.tar.gz
          scripts/build/setup-llvm-mingw.sh
          scripts/build/build-wine.sh
          scripts/build/build-freetype-ios.sh
          build/gnutls-ios/build.sh
          scripts/build/sync-gnutls-libs.sh
          build/ffmpeg/build.sh
          build/wineserver/bootstrap.sh
          build/wineserver/build.sh
          build/ntdll-unix/build.sh
          build/win32u-unix/build.sh
          xcodebuild -downloadComponent MetalToolchain || true
          scripts/build/build-shader-headers.sh
          scripts/build/prepare-vcruntime.sh
          build/stage-licenses.sh
